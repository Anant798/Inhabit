[/Script/Engine.RendererSettings]
; Fully dynamic: Lumen GI and reflections, hardware ray tracing for the mirror and glass.
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=2
; Ray-traced shadows: the long cove strips need real area shadows, shadow maps treat them as points.
r.RayTracing.Shadows=True
; Planar reflection on the mirror needs the global clip plane.
r.AllowGlobalClipPlane=True
; Glass reflects the room (otherwise translucent surfaces fall back to reflection probes: black here).
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
r.DefaultFeature.AutoExposure=False

[SystemSettings]
; 6 downlights + coves + niches overlap in a small room: the default 16 lights per pixel overflows.
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=32

